<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <!-- Navbar -->
 
  <nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
      <button id="themeToggle" class="btn btn-outline-light btn-sm">🌙 Dark mode</button>
    </div>
  </nav>
</header>

  <main class="container my-4">

    <!-- Alerts are added here by JavaScript -->
    <div id="alertBox"></div>

        <!-- Summary cards -->
    <div class="summary-grid mb-4">
      <div class="card text-center">
        <div class="card-body">
          <h6 class="card-subtitle text-muted">Total amount</h6>
          <h3 class="card-title" id="totalAmount">0</h3>
        </div>
      </div>
      <div class="card text-center">
        <div class="card-body">
          <h6 class="card-subtitle text-muted">Number of expenses</h6>
          <h3 class="card-title" id="expenseCount">0</h3>
        </div>
      </div>
      <div class="card text-center">
        <div class="card-body">
          <h6 class="card-subtitle text-muted">Highest expense</h6>
          <h3 class="card-title" id="highestExpense">0</h3>
        </div>
      </div>
    </div>
<!-- Add expense form -->
<div class="card mb-4">
  <div class="card-body">
    <h5 class="card-title">Add an expense</h5>

    <form id="addExpenseForm">
      <div class="row g-2">

        <div class="col-12 col-md-3">
          <label for="titleInput" class="form-label">Title</label>
          <input type="text" class="form-control" id="titleInput">
        </div>

        <div class="col-12 col-md-2">
          <label for="amountInput" class="form-label">Amount</label>
          <input type="number" step="0.01" class="form-control" id="amountInput">
        </div>

        <div class="col-12 col-md-3">
          <label for="categoryInput" class="form-label">Category</label>
          <select class="form-select" id="categoryInput">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="col-12 col-md-2">
          <label for="dateInput" class="form-label">Date</label>
          <input type="date" class="form-control" id="dateInput">
        </div>

        <div class="col-12 col-md-2 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Add</button>
        </div>

      </div>
    </form>

  </div>
</div>
    <!-- Filter -->
<div class="mb-3">
  <label for="categoryFilter" class="form-label">Filter by category</label>
  <select id="categoryFilter" class="form-select" style="max-width: 250px;">
    <option value="All">All</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Bills">Bills</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Other">Other</option>
  </select>
</div>
    <!-- Spinner -->
    <div id="spinner" class="text-center my-4 d-none">
      <div class="spinner-border" role="status"></div>
    </div>

    <!-- Table: the tbody stays EMPTY, JavaScript fills it -->
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="expenseTableBody"></tbody>
      </table>
    </div>

    <!-- Edit expense modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Edit expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <div id="editAlertBox"></div>
        <form id="editExpenseForm">
          <input type="hidden" id="editIdInput">

          <div class="mb-3">
            <label for="editTitleInput" class="form-label">Title</label>
            <input type="text" class="form-control" id="editTitleInput">
          </div>

          <div class="mb-3">
            <label for="editAmountInput" class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="editAmountInput">
          </div>

          <div class="mb-3">
            <label for="editCategoryInput" class="form-label">Category</label>
            <select class="form-select" id="editCategoryInput">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="editDateInput" class="form-label">Date</label>
            <input type="date" class="form-control" id="editDateInput">
          </div>

          <button type="submit" class="btn btn-primary w-100">Save changes</button>
        </form>
      </div>

    </div>
  </div>
</div>
  </main>
  <footer>

      </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>


</body>
</html>
